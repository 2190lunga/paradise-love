<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>💘 Lungani ❤️ Samkelo</title>

  <style>
    :root {
      --bg1: #0b1020;
      --bg2: #1a0933;
      --card: rgba(255, 255, 255, 0.08);
      --border: rgba(255, 255, 255, 0.14);
      --text: rgba(255, 255, 255, 0.92);
      --muted: rgba(255, 255, 255, 0.72);
      --shadow: 0 20px 60px rgba(0,0,0,0.45);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial;
      color: var(--text);
      background:
        radial-gradient(1200px 800px at 20% 10%, #1b2a6d33, transparent 55%),
        radial-gradient(900px 700px at 85% 30%, #ff4da622, transparent 60%),
        linear-gradient(135deg, var(--bg1), var(--bg2));
    }

    .orb {
      position: absolute;
      width: 360px;
      height: 360px;
      border-radius: 50%;
      filter: blur(30px);
      opacity: 0.25;
      animation: float 8s ease-in-out infinite;
      pointer-events: none;
    }

    .orb.one {
      background: #ff4da6;
      top: -140px;
      left: -120px;
    }

    .orb.two {
      background: #2ef2c5;
      bottom: -160px;
      right: -140px;
      animation-delay: 1.3s;
    }

    .orb.three {
      background: #8b5cff;
      top: 55%;
      left: 65%;
      width: 280px;
      height: 280px;
      animation-delay: 2.2s;
    }

    @keyframes float {
      0%,100% {
        transform: translate(0,0) scale(1);
      }
      50% {
        transform: translate(18px,-12px) scale(1.04);
      }
    }

    .card {
      width: min(680px, 92vw);
      padding: 28px 22px 22px;
      border: 1px solid var(--border);
      border-radius: 22px;
      background: var(--card);
      box-shadow: var(--shadow);
      backdrop-filter: blur(14px);
      position: relative;
      overflow: hidden;
      text-align: center;
    }

    .sparkleLine {
      position: absolute;
      inset: -1px;
      border-radius: 22px;
      pointer-events: none;
      background:
        radial-gradient(
          260px 80px at 20% 0%,
          rgba(255,77,166,0.25),
          transparent 60%
        ),
        radial-gradient(
          260px 80px at 80% 100%,
          rgba(46,242,197,0.18),
          transparent 60%
        );
      mix-blend-mode: screen;
    }

    .names {
      font-size: 12px;
      letter-spacing: 1.6px;
      color: rgba(255,255,255,0.65);
      margin-bottom: 6px;
      text-transform: uppercase;
    }

    .title {
      font-size: clamp(24px, 3vw, 32px);
      font-weight: 900;
      margin: 0 0 6px;
    }

    .subtitle {
      margin: 0 0 16px;
      color: var(--muted);
      font-size: 14px;
    }

    .question {
      margin: 14px 0 8px;
      font-size: clamp(24px, 3.2vw, 40px);
      font-weight: 950;
      letter-spacing: 0.4px;
    }

    .status {
      margin: 10px auto 18px;
      color: var(--muted);
      min-height: 30px;
      font-size: 14px;
      font-weight: 800;
    }

    /* DATE OPTIONS */

    .options {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin: 18px 0;
    }

    .dateOption {
      border: 1px solid rgba(255,255,255,0.15);
      background: rgba(255,255,255,0.06);
      color: var(--text);
      padding: 14px;
      border-radius: 15px;
      cursor: pointer;
      text-align: left;
      transition: 0.2s ease;
    }

    .dateOption:hover {
      transform: translateY(-2px);
      border-color: rgba(255,255,255,0.3);
      background: rgba(255,255,255,0.10);
    }

    .dateOption.selected {
      border-color: rgba(255,77,166,0.7);
      background: rgba(255,77,166,0.16);
      transform: translateY(-2px);
    }

    .dateOption strong {
      display: block;
      font-size: 15px;
      margin-bottom: 5px;
    }

    .dateOption span {
      display: block;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.4;
    }

    .buttons {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
      position: relative;
      margin-top: 10px;
    }

    button {
      appearance: none;
      border: 1px solid rgba(255,255,255,0.18);
      background: rgba(255,255,255,0.08);
      color: var(--text);
      padding: 12px 18px;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 900;
      cursor: pointer;
      transition:
        transform 0.15s ease,
        border-color 0.15s ease,
        opacity 0.15s ease;
      box-shadow: 0 10px 25px rgba(0,0,0,0.22);
      min-width: 150px;
    }

    button:hover {
      transform: translateY(-1px);
      border-color: rgba(255,255,255,0.28);
    }

    button:active {
      transform: translateY(1px) scale(0.98);
    }

    .yes {
      background:
        linear-gradient(
          135deg,
          rgba(255,77,166,0.32),
          rgba(255,46,99,0.20)
        );
      border-color: rgba(255,77,166,0.35);
    }

    .no {
      background:
        linear-gradient(
          135deg,
          rgba(46,242,197,0.18),
          rgba(255,255,255,0.06)
        );
      border-color: rgba(46,242,197,0.32);
    }

    .hint {
      margin-top: 14px;
      font-size: 12px;
      color: rgba(255,255,255,0.55);
    }

    /* SHAKE */

    .shake {
      animation: shake 0.35s ease-in-out;
    }

    @keyframes shake {
      0%,100% { transform: translateX(0); }
      20% { transform: translateX(-8px); }
      40% { transform: translateX(8px); }
      60% { transform: translateX(-6px); }
      80% { transform: translateX(6px); }
    }

    /* GROW */

    .grow-text {
      animation: growBounce 0.45s ease-out;
    }

    @keyframes growBounce {
      0%   { transform: scale(1); }
      60%  { transform: scale(1.25); }
      100% { transform: scale(1.15); }
    }

    /* RUNAWAY */

    .runaway {
      position: relative;
      transition: transform 0.3s ease;
      will-change: transform;
    }

    /* OVERLAY */

    .overlay {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      background:
        radial-gradient(
          650px 420px at 50% 40%,
          rgba(255,77,166,0.25),
          transparent 65%
        ),
        rgba(0,0,0,0.35);
      border-radius: 22px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.35s ease;
      padding: 16px;
    }

    .overlay.show {
      opacity: 1;
      pointer-events: auto;
    }

    .finalBox {
      width: min(560px, 92%);
      text-align: center;
      padding: 18px 14px;
      border-radius: 18px;
      border: 1px solid rgba(255,255,255,0.18);
      background: rgba(10,10,20,0.62);
      backdrop-filter: blur(10px);
      box-shadow: var(--shadow);
    }

    .finalBox h2 {
      margin: 0 0 8px;
      font-size: 22px;
    }

    .finalBox p {
      margin: 0 0 12px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.55;
    }

    .tiny {
      margin-top: 10px;
      font-size: 12px;
      color: rgba(255,255,255,0.6);
    }

    /* HEARTS + CONFETTI */

    .hearts,
    .confetti {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .heart {
      position: absolute;
      font-size: 18px;
      opacity: 0.9;
      animation: rise linear forwards;
      filter: drop-shadow(0 10px 10px rgba(0,0,0,0.25));
    }

    @keyframes rise {
      0% {
        transform: translateY(0) scale(0.9);
        opacity: 0;
      }

      10% {
        opacity: 0.95;
      }

      100% {
        transform: translateY(-110vh) scale(1.35);
        opacity: 0;
      }
    }

    .conf {
      position: absolute;
      width: 10px;
      height: 14px;
      border-radius: 3px;
      opacity: 0.95;
      animation: fall linear forwards;
      transform: translateY(-20px) rotate(0deg);
    }

    @keyframes fall {
      to {
        transform: translateY(115vh) rotate(720deg);
        opacity: 0.9;
      }
    }

    @media (max-width: 600px) {
      .options {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <div class="orb one"></div>
  <div class="orb two"></div>
  <div class="orb three"></div>

  <div class="hearts" id="hearts"></div>
  <div class="confetti" id="confetti"></div>

  <main class="card" id="card">

    <div class="sparkleLine"></div>

    <div class="names">LUNGANI ❤️ SAMKELO</div>

    <h1 class="title">Hey Samkelo 💌</h1>

    <p class="subtitle">
      I have a very important question for you... 👀
    </p>

    <div class="question">
      Dinner date? 😌
    </div>

    <div class="status" id="status">
      But you get to choose the vibe 👀
    </div>

    <div class="options">

      <button class="dateOption" data-choice="Acrobranch Pretoria">
        <strong>🌳 Acrobranch Pretoria</strong>
        <span>
          A little adventure... let's see who gets scared first 😂
        </span>
      </button>

      <button class="dateOption" data-choice="The Social Grill">
        <strong>🍽️ The Social Grill</strong>
        <span>
          Good food, good conversation. Simple and classy 😌
        </span>
      </button>

      <button class="dateOption" data-choice="16 by KOI">
        <strong>🥂 16 by KOI</strong>
        <span>
          Okayyy, so we're going fancy? 👀
        </span>
      </button>

      <button class="dateOption" data-choice="Hiking + KAUAI">
        <strong>🥾 Hiking + KAUAI</strong>
        <span>
          Nothing hectic... just a hike and a smoothie 😌
        </span>
      </button>

    </div>

    <div class="buttons" id="btnWrap">

      <button class="yes" id="yesBtn">
        I'm in 💖
      </button>

      <button class="no runaway" id="noBtn">
        Let me think 🙈
      </button>

    </div>

    <div class="hint">
      Choose wisely... I'm judging your date choice 😭😂
    </div>

    <div class="overlay" id="overlay">

      <div class="finalBox">

        <h2 id="finalTitle">
          Ayyyy, Samkelo! 😭❤️
        </h2>

        <p id="finalText">
          So you actually said yes? 👀
        </p>

        <p>
          <strong id="chosenDate"></strong>
        </p>

        <p>
          Okay, I'll make the arrangements. 😌
        </p>

        <button id="closeBtn">
          Can't wait 💕
        </button>

        <div class="tiny">
          Made with love by Lungani ❤️
        </div>

      </div>

    </div>

  </main>

  <script>

    const statusEl = document.getElementById("status");
    const yesBtn = document.getElementById("yesBtn");
    const noBtn = document.getElementById("noBtn");
    const card = document.getElementById("card");
    const overlay = document.getElementById("overlay");
    const btnWrap = document.getElementById("btnWrap");
    const chosenDate = document.getElementById("chosenDate");
    const closeBtn = document.getElementById("closeBtn");

    const heartsWrap = document.getElementById("hearts");
    const confettiWrap = document.getElementById("confetti");

    const dateOptions = document.querySelectorAll(".dateOption");

    let selectedDate = "";
    let noClicks = 0;
    let yesClicks = 0;


    /* -------------------------
       DATE SELECTION
    ------------------------- */

    dateOptions.forEach(option => {

      option.addEventListener("click", () => {

        dateOptions.forEach(item => {
          item.classList.remove("selected");
        });

        option.classList.add("selected");

        selectedDate = option.dataset.choice;

        setStatus(
          `${selectedDate}? 👀 I see what kind of girl you are 😂`
        );

        statusEl.classList.remove("grow-text");
        void statusEl.offsetWidth;
        statusEl.classList.add("grow-text");

      });

    });


    /* -------------------------
       STATUS
    ------------------------- */

    function setStatus(msg) {
      statusEl.textContent = msg;
    }


    /* -------------------------
       SHAKE
    ------------------------- */

    function shakeCard() {

      card.classList.remove("shake");

      void card.offsetWidth;

      card.classList.add("shake");

    }


    /* -------------------------
       HEARTS
    ------------------------- */

    function spawnHearts(durationMs = 3200) {

      const emojis = [
        "💖",
        "💗",
        "💘",
        "💝",
        "💕",
        "💞"
      ];

      const endAt = Date.now() + durationMs;

      const interval = setInterval(() => {

        const h = document.createElement("div");

        h.className = "heart";

        h.textContent =
          emojis[Math.floor(Math.random() * emojis.length)];

        h.style.left =
          Math.random() * 100 + "vw";

        h.style.bottom =
          (-10 - Math.random() * 10) + "px";

        h.style.fontSize =
          (14 + Math.random() * 24) + "px";

        h.style.animationDuration =
          (1800 + Math.random() * 1700) + "ms";

        heartsWrap.appendChild(h);

        h.addEventListener(
          "animationend",
          () => h.remove()
        );

        if (Date.now() > endAt) {
          clearInterval(interval);
        }

      }, 70);
    }


    /* -------------------------
       CONFETTI
    ------------------------- */

    function spawnConfetti(pieces = 160) {

      const colors = [
        "rgba(255,77,166,0.95)",
        "rgba(46,242,197,0.9)",
        "rgba(255,255,255,0.9)",
        "rgba(139,92,255,0.9)",
        "rgba(255,46,99,0.9)"
      ];

      for (let i = 0; i < pieces; i++) {

        const c = document.createElement("div");

        c.className = "conf";

        c.style.left =
          Math.random() * 100 + "vw";

        c.style.top =
          (-30 - Math.random() * 60) + "px";

        c.style.background =
          colors[Math.floor(Math.random() * colors.length)];

        c.style.width =
          (6 + Math.random() * 10) + "px";

        c.style.height =
          (10 + Math.random() * 14) + "px";

        c.style.animationDuration =
          (1500 + Math.random() * 1600) + "ms";

        c.style.animationDelay =
          (Math.random() * 250) + "ms";

        confettiWrap.appendChild(c);

        c.addEventListener(
          "animationend",
          () => c.remove()
        );

      }
    }


    /* -------------------------
       MOVE NO BUTTON
    ------------------------- */

    function moveNoButtonRandomly() {

      const wrapRect =
        btnWrap.getBoundingClientRect();

      const btnRect =
        noBtn.getBoundingClientRect();

      const maxX =
        Math.max(
          10,
          (wrapRect.width - btnRect.width) / 2
        );

      const maxY = 36;

      const x =
        (Math.random() * 2 - 1) * maxX;

      const y =
        (Math.random() * 2 - 1) * maxY;

      noBtn.style.transform =
        `translate(${x}px, ${y}px)`;

    }


    /* -------------------------
       YES
    ------------------------- */

    yesBtn.addEventListener("click", () => {

      yesClicks++;

      if (!selectedDate) {

        setStatus(
          "Hold on 😭 You haven't even chosen the date!"
        );

        shakeCard();

        return;
      }

      if (yesClicks === 1) {

        setStatus(
          `${selectedDate} it is? 👀 Are you sure? 😂`
        );

        statusEl.classList.remove("grow-text");

        void statusEl.offsetWidth;

        statusEl.classList.add("grow-text");

        spawnHearts(1000);

        return;
      }

      if (yesClicks === 2) {

        setStatus(
          "Okay okay 😭 I just wanted to make sure..."
        );

        spawnHearts(1200);

        return;
      }

      /* FINAL YES */

      chosenDate.textContent =
        `📍 ${selectedDate}`;

      setStatus(
        "Ayyyyy 😭❤️ It's actually happening!"
      );

      overlay.classList.add("show");

      spawnConfetti(190);

      spawnHearts(3800);

      yesBtn.disabled = true;
      noBtn.disabled = true;

    });


    /* -------------------------
       NO / LET ME THINK
    ------------------------- */

    noBtn.addEventListener("click", () => {

      noClicks++;

      if (noClicks === 1) {

        moveNoButtonRandomly();

        shakeCard();

        setStatus(
          "Let you think? 😭 You already came this far..."
        );

        return;
      }

      if (noClicks === 2) {

        moveNoButtonRandomly();

        setStatus(
          "Samkelo please 😂 don't embarrass us both."
        );

        return;
      }

      if (noClicks === 3) {

        setStatus(
          "Okay fine 😭 I'll give you one last chance."
        );

        moveNoButtonRandomly();

        return;
      }

      setStatus(
        "You know you're supposed to say yes, right? 😂❤️"
      );

    });


    /* -------------------------
       CLOSE OVERLAY
    ------------------------- */

    closeBtn.addEventListener("click", () => {

      overlay.classList.remove("show");

    });


    overlay.addEventListener("click", (event) => {

      if (event.target === overlay) {
        overlay.classList.remove("show");
      }

    });

  </script>

</body>
</html>
